# Offline Payment Mesh — Application Configuration
# Author: Arvind Dwivedi
# ═══════════════════════════════════════════════════════════════

# Server
server.port=8080

# H2 in-memory database (zero-setup, perfect for demos)
spring.datasource.url=jdbc:h2:mem:offlinepay
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.arvind.offlinepay=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Deduplication window (how long a packet hash stays claimed)
offlinepay.dedup.ttl-seconds=86400

# Packet freshness window — older packets are rejected as replays
offlinepay.packet.max-age-seconds=86400
